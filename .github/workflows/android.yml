name: Build NOIR APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract NOIR Build 03 source
        run: |
          unzip -q NOIR-Android-Phone-Build-03.zip -d .
          test -f NOIR/settings.gradle.kts

      - name: Publish extracted source for the next update
        run: |
          if [ -n "$(git status --porcelain -- NOIR)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add NOIR
            git commit -m "Add extracted NOIR Build 03 source"
            git push
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build NOIR
        working-directory: NOIR
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-Build-03-APK
          path: NOIR/app/build/outputs/apk/debug/*.apk
