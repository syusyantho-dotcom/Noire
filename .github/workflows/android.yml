name: Build NOIR APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NOIR/**'
      - '.github/workflows/android.yml'

concurrency:
  group: noir-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build NOIR
        working-directory: NOIR
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-APK-build-${{ github.run_number }}
          path: NOIR/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

# Home polish verification
