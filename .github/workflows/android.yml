
name: Build NOIR APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NOIR project
        run: |
          unzip -q NOIR-Android-Phone-Build.zip -d .
          test -f NOIR/settings.gradle.kts
          test -f NOIR/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build NOIR APK
        working-directory: NOIR
        run: gradle assembleDebug

      - name: Upload NOIR APK
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-APK
          path: NOIR/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
